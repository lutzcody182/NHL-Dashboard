          node "$RUNNER_TEMP/combos.js"

      - name: Install page runner
        run: npm install --prefix "$RUNNER_TEMP/tk" jsdom@24 --no-audit --no-fund --silent

      - name: Save and grade goal scorer and game model picks
        run: |
          cat > "$RUNNER_TEMP/track.js" <<'EOF'
          // Pick tracker: runs the dashboard's own models (from index.html) headlessly. Saves today's pre-game goal scorer picks
          // (DraftKings prices) and Game model v2 moneyline picks to picks.json, grades finished ones, and records each day's
          // model test scores so the dashboard can chart accuracy over time.
          const fs = require('fs');
          const { JSDOM } = require('jsdom');
          const ET = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).replace(/-/g, '');
          const readJSON = (f, dflt) => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch (e) { return dflt; } };
          const log = (...a) => console.log(...a);

          async function boot(fetchImpl) {
            const html = fs.readFileSync('index.html', 'utf8');
            const dom = new JSDOM(html.replace(/<link[^>]+fonts[^>]*>/g, ''), { runScripts: 'outside-only', url: 'https://example.org/' });
            const w = dom.window;
            w.fetch = async (u, o) => {
              const url = String(u);
              if (!/^https?:/.test(url)) { // local files: lines.json, props.json
                const f = url.split('?')[0]; const ok = fs.existsSync(f);
                return { ok, status: ok ? 200 : 404, json: async () => JSON.parse(fs.readFileSync(f, 'utf8')) };
              }
              return fetchImpl(url, o);
            };
            w.matchMedia = () => ({ matches: false, addEventListener() {} }); w.scrollTo = () => {};
            w.addEventListener('error', e => log('page error:', e.message));
            const script = html.split('<script>')[1].split('</script>')[0];
            w.eval(script + `;window.__t = { A, S, VER, API, ensureData, gsGetState, gsTonight, GM, gmCollect, gmTrain, gmEventPick, getInjuries, gsBlendFit, GS, gsMateMap, seasonOf, fixFinal, getPHFile, PHF, gsRoster, gsGoalie, gsLambda, dkPriceMap, dkLookup, dobPrep, amImplied, betEV, probableGoalies, getJSON, getGame, addTeam, TM, fairAmerican, fgShiftIdx, fgAttempts, fgFit, fgGame, sogState, sogTonight, sogBlendFit, SOGB };`);
            return w.__t;
          }

          async function run({ fetchImpl = fetch, now = new Date(), preload } = {}) {
            const T = await boot(fetchImpl);
            await new Promise(r => setTimeout(r, 4000)); // let the page find the current season
            if (!T.S.curSeason) { const d = new Date(); T.S.curSeason = d.getMonth() >= 7 ? d.getFullYear() + 1 : d.getFullYear(); }
            T.A.season = T.S.curSeason; T.A.range = 'season'; T.A.types = 'reg'; T.A.note = '';
            // saved processed games from earlier runs (GitHub cache) so only new games are downloaded
            const cache = readJSON('.cache/games.json', []);
            let pre = 0; for (const g of cache) if (g && g.v === T.VER && g.final) { T.A.games.set(g.id, T.fixFinal(g)); T.addTeam(g.home); T.addTeam(g.away); pre++; }
            log(`Loaded ${pre} saved games from cache.`);
            if (preload) await preload(T); else await T.ensureData(true);
            log(`Model data: ${T.A.filtered.length} completed games this season.`);
            // game model: last season + this season (saved games come from the cache)
            let gmOK = false;
            await T.getPHFile(); log(T.PHF.idx ? `Post Hockey ratings loaded: ${Object.entries(T.PHF.data.seasons).map(([k, v]) => k + ' ' + v.length).join(', ')}` : 'No Post Hockey ratings file.');
            try {
              const all = preload ? [...T.A.games.values()].filter(g => g && g.final) : await T.gmCollect(() => {});
              const M = T.gmTrain(all);
              if (M.error) log('Game model: ' + M.error); else { T.GM.model = M; gmOK = true; log(`Game model trained on ${M.nRows} games · test accuracy ${(M.sKeep.acc * 100).toFixed(1)}% · rest: ${M.restV === 'v2' ? 'back-to-backs + long layoffs' : 'per-day difference'} · lineup vs. usual: ${M.luV === 'v2' ? 'one combined factor' : 'two separate factors'}`); }
            } catch (e) { log('Game model error: ' + (e.stack || e.message)); }
            fs.mkdirSync('.cache', { recursive: true });
            fs.writeFileSync('.cache/games.json', JSON.stringify([...T.A.games.values()].filter(g => g && g.final)));

            const picks = readJSON('picks.json', { picks: [] });
            const byKey = new Map((picks.picks || []).map(p => [p.k, p])), gByKey = new Map((picks.games || []).map(g => [g.k, g])), fByKey = new Map((picks.first || []).map(p => [p.k, p])), sByKey = new Map((picks.sog || []).map(p => [p.k, p]));
            // one-time fix: before Oct 18 2026 the forward Elias Pettersson was given the defenseman Elias Pettersson's prices (same name), so those picks were never real
            for (const M of [byKey, fByKey]) for (const [k, p] of M) if (p.pid === '4233566' && p.date <= '20261017') M.delete(k);

            // 1) today's pre-game picks
            const today = ET(now);
            let sb = null; try { sb = await T.getJSON(`${T.API}/scoreboard?dates=${today}`); } catch (e) { log('Scoreboard error: ' + e.message); }
            const PF = readJSON('props.json', null), LF = readJSON('lines.json', null); await T.dobPrep(PF); // birth years for same-named players (e.g. the two Elias Petterssons)
            let added = 0, updated = 0, gAdded = 0, dropped = 0, sAdded = 0;
            T.gsBlendFit(picks); T.sogBlendFit(picks); log(`Goal scorer chances: ${Math.round(T.GS.blendW * 100)}% model / ${Math.round((1 - T.GS.blendW) * 100)}% DraftKings (learned from ${T.GS.blendN} graded picks).`);
            // last season is the goal scorer model's starting point (counted at half weight)
            T.GS.prior = [...T.A.games.values()].filter(g => g && g.final && T.seasonOf(g.date) === T.S.curSeason - 1);
            const gs = T.A.filtered.length || T.GS.prior.length ? T.gsGetState() : null;
            if (gs) log(`Goal scorer model: ${T.A.filtered.length} games this season + ${T.GS.prior.length} from last season.`);
            const MATE = gs && sb ? T.gsMateMap(gs.S, LF, sb.events || []) : null;
            // first goal scorer model (period ice time from props.json → shifts, first-period habits learned from real first goals)
            let fgFitV = null, fgATT = null, fAdded = 0;
            if (gs && PF) { try { T.fgShiftIdx(PF); const fgGames = [...T.GS.prior, ...T.A.filtered]; fgATT = T.fgAttempts(fgGames); fgFitV = T.fgFit(fgGames, PF); log(`First goal model: early ice weight ${fgFitV.a}, P1 shooting weight ${fgFitV.b}${fgFitV.untested ? ' (not tested yet)' : ''}${PF.shifts ? '' : ', no shift data yet'}.`); } catch (e) { log('First goal model error: ' + (e.stack || e.message)); } }
            if (sb) for (const e of sb.events || []) {
              const c = e.competitions[0];
              if (c.status.type.state !== 'pre' || new Date(e.date) <= now) continue; // only games that haven't started
              const inj = await T.getInjuries(e.id);
              // game model moneyline pick
              if (gmOK) {
                const gp = T.gmEventPick(e, inj, LF, PF);
