  close:
    # every 30 minutes in the evening: record closing prices for picks starting in the next 90 minutes (the last reading before puck drop wins) (closing line value)
    needs: lines
    if: always() && github.event.inputs.task == 'lines'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # start from the newest commit, not the one from when the run was queued

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Record closing prices for picks starting soon
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git pull --quiet || true
          cat > "$RUNNER_TEMP/close.js" <<'EOF'
          // Closing prices for saved picks: runs every 30 minutes and records the price just before puck drop
          // (the moneyline from ESPN, and DraftKings' goal scorer price via The Odds API) so the dashboard can measure closing line value.
          const fs = require('fs');
          const log = (...a) => console.log(...a);
          const normName = x => (x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');
          const etDay = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).replace(/-/g, '');
          async function run({ fetchImpl = fetch, now = Date.now(), key = process.env.ODDS_API_KEY } = {}) {
            let P; try { P = JSON.parse(fs.readFileSync('picks.json', 'utf8')); } catch (e) { log('No picks.json yet.'); return 0; }
            const W = 90 * 60e3, LATE = 15 * 60e3, inWin = t => t > now - LATE && t - now <= W, soon = x => inWin(new Date(x.start).getTime()); // up to 90 min before the listed start, and a few minutes after it (puck drop runs late; ESPN must still say pre-game)
            const fresh = x => !x.closeAt || now - new Date(x.closeAt).getTime() > 20 * 60e3; // refresh at most every 20 minutes
            const games = (P.games || []).filter(soon), picks = (P.picks || []).filter(p => soon(p) && p.dk != null && fresh(p)); // DraftKings: refreshed every 20 minutes in the last 90 minutes (the last reading before puck drop wins)
            if (!games.length && !picks.length) { log('No saved picks starting in the next 90 minutes.'); return 0; }
            let changed = 0;
            // moneylines (ESPN, free)
            const pre = new Set(); // games ESPN still lists as pre-game (never record a price once the game is live)
            for (const day of new Set([...games, ...picks].map(g => etDay(g.start)))) {
              let sb = null; try { const r = await fetchImpl(`https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=${day}`); sb = r.ok ? await r.json() : null; } catch (e) { log('ESPN error: ' + e.message); }
              for (const e of (sb && sb.events) || []) if (e.competitions[0].status.type.state === 'pre') pre.add(String(e.id));
              for (const g of games.filter(x => etDay(x.start) === day)) {
                const e = sb && (sb.events || []).find(x => String(x.id) === g.gid), c = e && e.competitions[0];
                if (!c || c.status.type.state !== 'pre') continue;
                // ESPN moved the moneyline to odds.moneyline.home.close.odds ("-130"); read either place
                const o = c.odds && c.odds[0], num = x => { const n = x == null ? NaN : parseFloat(String(x).replace(/^even$/i, '100')); return Number.isFinite(n) && Math.abs(n) >= 100 ? n : null; };
                const nw = s => s ? num(s.close && s.close.odds) ?? num(s.open && s.open.odds) : null, mo = o && o.moneyline;
                const h = num(o && o.homeTeamOdds && o.homeTeamOdds.moneyLine) ?? nw(mo && mo.home), a = num(o && o.awayTeamOdds && o.awayTeamOdds.moneyLine) ?? nw(mo && mo.away);
                if (h != null && a != null && h !== '' && a !== '' && isFinite(h) && isFinite(a)) { g.mlCloseH = +h; g.mlCloseA = +a; g.closeAt = new Date(now).toISOString(); changed++; log(`${g.aa} @ ${g.ha}: closing moneyline ${a} / ${h}`); }
              }
            }
            // goal scorer prices (DraftKings via The Odds API; one request per game starting soon)
            if (picks.length && !key) log('No ODDS_API_KEY: skipping goal scorer closing prices.');
            if (picks.length && key) {
              const BASE = 'https://api.the-odds-api.com/v4/sports/icehockey_nhl';
              let events = []; try { const r = await fetchImpl(`${BASE}/events?apiKey=${key}`); events = r.ok ? await r.json() : []; } catch (e) { log('Odds API error: ' + e.message); }
              for (const ev of events) {
                const t = new Date(ev.commence_time).getTime(); if (!inWin(t)) continue;
                const mine = picks.filter(p => pre.has(String(p.gid)) && Math.abs(new Date(p.start).getTime() - t) < 20 * 60e3); if (!mine.length) continue;
                try {
                  const r = await fetchImpl(`${BASE}/events/${ev.id}/odds?apiKey=${key}&regions=us&markets=player_goal_scorer_anytime&bookmakers=draftkings&oddsFormat=american`);
                  if (!r.ok) throw new Error('HTTP ' + r.status);
                  const data = await r.json(), bk = (data.bookmakers || []).find(b => b.key === 'draftkings'), mk = bk && (bk.markets || []).find(m => m.key === 'player_goal_scorer_anytime');
                  const m = {}; for (const o of (mk && mk.outcomes) || []) if (!/^no$/i.test(o.name || '') && Number.isFinite(o.price)) m[normName(o.description || o.name)] = o.price;
                  let n = 0; for (const p of mine) { const price = m[normName(p.n)]; if (price != null) { p.dkClose = price; p.closeAt = new Date(now).toISOString(); n++; changed++; } }
                  log(`${ev.away_team} @ ${ev.home_team}: closing DraftKings prices for ${n} saved picks`);
                } catch (e) { log(`::warning::${ev.away_team} @ ${ev.home_team}: ${e.message}`); }
              }
            }
            if (changed) fs.writeFileSync('picks.json', JSON.stringify(P));
            log(`Recorded ${changed} closing prices.`);
            return changed;
          }
          module.exports = { run };
          if (require.main === module) run().then(() => process.exit(0)).catch(e => { console.log('::error::' + (e.stack || e.message)); process.exit(1); });
          EOF
          node "$RUNNER_TEMP/close.js"

      - name: Commit picks.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add picks.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Record closing prices"
          git pull --rebase --quiet || true
          git push

  repick:
    # evening, every 30 minutes: if a starting goalie got confirmed or switched for a game with saved picks,
    # re-run both models and re-save those picks (no Odds API requests used)
    needs: close
    if: always() && github.event.inputs.task == 'lines'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # start from the newest commit, not the one from when the run was queued

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check for upcoming games (goalie news, line history)
        id: check
        run: |
          git pull --quiet || true
          cat > "$RUNNER_TEMP/precheck.js" <<'EOF'
          // Evening check: has goalie news changed for any game with saved picks that hasn't started yet? (no API credits used)
          const fs = require('fs');
          const etDay = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).replace(/-/g, '');
          async function run({ fetchImpl = fetch, now = Date.now() } = {}) {
            let P; try { P = JSON.parse(fs.readFileSync('picks.json', 'utf8')); } catch (e) { return false; }
            const soon = (P.games || []).filter(g => { const t = new Date(g.start).getTime(); return g.hw == null && t > now && t - now < 14 * 3600e3; });
            if (!soon.length) { console.log('No saved game picks starting in the next 14 hours.'); return false; }
            const conf = st => /confirm/i.test(st || '') ? 'C' : 'P';
            // RotoGrinders' projected goalie is the backup source when ESPN hasn't listed one
            let LF = null; try { LF = JSON.parse(fs.readFileSync('lines.json', 'utf8')); } catch (e) {}
            const nn = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z]/g, '');
            const rgGoalie = (teamName, start) => { if (!LF || !LF.games || LF.date !== new Date(start).toLocaleDateString('en-CA', { timeZone: 'America/New_York' })) return ''; const t = LF.games.flatMap(x => x.teams || []).find(x => nn(x.team) === nn(teamName)); return (t && t.goalie) || ''; };
            let changed = false;
            for (const day of new Set(soon.map(g => etDay(g.start)))) {
              let sb = null; try { const r = await fetchImpl(`https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=${day}`); sb = r.ok ? await r.json() : null; } catch (e) {}
              for (const g of soon.filter(x => etDay(x.start) === day)) {
                const e = sb && (sb.events || []).find(x => String(x.id) === g.gid); if (!e || e.competitions[0].status.type.state !== 'pre') continue;
                for (const c of e.competitions[0].competitors) {
                  const p = (c.probables || []).find(q => /goalie/i.test(q.name || '')) || (c.probables || [])[0];
                  if (!p || !p.athlete) { // no ESPN starter yet: did RotoGrinders' projection change?
                    const home = c.homeAway === 'home', rg = rgGoalie(c.team && c.team.displayName, g.start), savedN = home ? g.gH : g.gA;
