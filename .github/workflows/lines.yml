
# Updates lines.json with today's NHL forward lines, defense pairs and goalies from RotoGrinders, and props.json with
# DraftKings anytime and first goal scorer odds (The Odds API) plus period-by-period ice time from the NHL's shift charts.
# The same run saves the models' pre-game picks to picks.json and grades finished games. Evening runs also record the
# price just before puck drop (closing line value) and re-run both models when a starting goalie is confirmed or changed.
#
# Timing comes from an outside scheduler (cron-job.org) instead of GitHub's own schedule, which often runs hours late or
# skips runs. It starts this workflow through GitHub's API with one of these tasks:
#   lines  every 30 minutes, 10 AM to 12:30 AM Eastern: lines + closing prices + goalie re-picks
#   props  every 2 hours, 11:07 AM to 7:07 PM Eastern: DraftKings odds, Post Hockey ratings, shift charts, picks and grading
#   all    lines + props (the default when you press "Run workflow" in the Actions tab)
name: Update NHL lines
run-name: "${{ github.event.inputs.task || 'all' }} · Update NHL lines"

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run: all = lines + odds/picks, lines = lines + closing prices + goalie re-picks, props = odds + picks'
        type: choice
        options: [all, lines, props]
        default: all

permissions:
  contents: write

concurrency:
  group: nhl-lines
  cancel-in-progress: false

jobs:
  lines:
    if: github.event.inputs.task != 'props'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # start from the newest commit, not the one from when the run was queued

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch and parse today's lines
        run: |
          node <<'EOF'
          const fs = require('fs');
          const PAGE_URL = 'https://rotogrinders.com/lineups/nhl';

          function parseLines(html) {
            const dec = s => s.replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&#0?39;|&apos;/g, "'").replace(/&quot;/g, '"')
              .replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n)).replace(/\s+/g, ' ').trim();
            const games = [];
            for (const b of html.split(/class="module game-card"/).slice(1)) {
              const cities = [...b.matchAll(/class="team-nameplate-city"[^>]*>([\s\S]*?)<\/span>/g)].map(m => dec(m[1]));
              const mascots = [...b.matchAll(/class="team-nameplate-mascot"[^>]*>([\s\S]*?)<\/span>/g)].map(m => dec(m[1]));
              const teams = cities.slice(0, 2).map((c, i) => `${c} ${mascots[i] || ''}`.trim());
              const time = (b.match(/(\d{1,2}:\d{2}\s*[AP]M(?:\s*ET)?)/) || [])[1] || '';
              const cards = b.split(/class="lineup-card"/).slice(1, 3).map(c => {
                const head = c.split(/class="lineup-card-body/)[0] || '';
                const body = c.split(/class="lineup-card-body/)[1] || '';
                const gm = head.match(/player-nameplate-name"[^>]*>([\s\S]*?)<\/a>/);
                const groups = []; let cur = null, m;
                const re = /<span class="bold small[^"]*"[^>]*>\s*([^<]+?)\s*<\/span>|<li class="lineup-card-player"[^>]*>([\s\S]*?)<\/li>/g;
                while ((m = re.exec(body))) {
                  if (m[1]) { cur = { label: dec(m[1]), players: [] }; groups.push(cur); continue; }
                  const name = (m[2].match(/player-nameplate-name"[^>]*>([\s\S]*?)<\/a>/) || [])[1];
                  if (!name) continue;
                  if (!cur) { cur = { label: 'Lineup', players: [] }; groups.push(cur); }
                  cur.players.push({ n: dec(name), pos: (m[2].match(/data-position="([^"]+)"/) || [])[1] || '', pp: (m[2].match(/>\s*(PP\d)\s*</) || [])[1] || '' });
                }
                return { goalie: gm ? dec(gm[1]) : '', groups };
              });
              if (teams.length === 2 && cards.length) games.push({ time, away: teams[0], home: teams[1], teams: cards.map((c, i) => ({ team: teams[i], ...c })) });
            }
            return games;
          }

          (async () => {
            const headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9',
              'Referer': 'https://rotogrinders.com/'
            };
            let html = null;
            for (let attempt = 1; attempt <= 3 && html == null; attempt++) {
              try {
                const res = await fetch(PAGE_URL, { headers });
                const text = await res.text();
                if (res.ok && text.includes('game-card')) { html = text; break; }
                console.log(`Attempt ${attempt}: HTTP ${res.status}, ${text.length} bytes. Page starts with: ${text.slice(0, 300).replace(/\s+/g, ' ')}`);
              } catch (e) { console.log(`Attempt ${attempt}: network error: ${e.message}`); }
              await new Promise(r => setTimeout(r, 5000 * attempt));
            }
            if (html == null) { console.error('::error::Could not read the RotoGrinders lineups page (see the attempts above).'); process.exit(1); }
            const games = parseLines(html);
            if (!games.length) console.log('::warning::Page loaded but no games were found. There may be no games today, or the page layout changed.');
            const date = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
            let old = null; try { old = JSON.parse(fs.readFileSync('lines.json', 'utf8')); } catch (e) {}
            if (old && old.date === date && JSON.stringify(old.games) === JSON.stringify(games)) { console.log('No changes.'); return; }
            fs.writeFileSync('lines.json', JSON.stringify({ source: 'RotoGrinders', url: PAGE_URL, date, updated: new Date().toISOString(), games }, null, 1));
            console.log(`Saved ${games.length} games for ${date}.`);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add lines.json
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Update NHL lines"
          git pull --rebase --quiet || true
          git push || { echo "::error::Push failed. In the repo go to Settings > Actions > General > Workflow permissions, choose 'Read and write permissions', and run again."; exit 1; }

  props:
    if: github.event.inputs.task != 'lines'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # start from the newest commit, not the one from when the run was queued

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch sportsbook odds (DraftKings, FanDuel, Caesars, Fanatics, theScore Bet; goals, moneyline, shots on goal)
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const KEY = process.env.ODDS_API_KEY;
          if (!KEY) { console.log('::error::No ODDS_API_KEY secret. Add it under Settings > Secrets and variables > Actions.'); process.exit(1); }
          const BASE = 'https://api.the-odds-api.com/v4/sports/icehockey_nhl';
          const get = async url => {
            const r = await fetch(url);
            const left = r.headers.get('x-requests-remaining'), used = r.headers.get('x-requests-used');
            if (left) console.log(`Odds API requests used: ${used}, remaining: ${left}`);
            if (!r.ok) throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0, 200)}`);
            return { data: await r.json(), left };
          };
          (async () => {
            // events list (does not count against the quota)
            const { data: events } = await get(`${BASE}/events?apiKey=${KEY}`);
            const now = Date.now(), soon = events.filter(e => { const t = new Date(e.commence_time).getTime(); return t > now - 600e3 && t < now + 16 * 3600e3; }); // today's slate only (each game costs Odds API credits)
            console.log(`${events.length} upcoming events, ${soon.length} in the next 16 hours`);
            const games = []; let remaining = null;
            for (const e of soon) {
              try {
                // all five books in one request: credits are charged per market, not per book (up to 10 books count as one region)
                const { data, left } = await get(`${BASE}/events/${e.id}/odds?apiKey=${KEY}&markets=player_goal_scorer_anytime,player_goal_scorer_first,h2h,player_shots_on_goal&bookmakers=draftkings,fanduel,williamhill_us,fanatics,espnbet&oddsFormat=american`);
                remaining = left ?? remaining;
                const book = k => (data.bookmakers || []).find(b => b.key === k), mkt = (b, m) => b && (b.markets || []).find(x => x.key === m);
                const nn = x => String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); // keeps a "(2004)" birth-year tag, so two same-named players stay apart
                const outs = (b, m) => { const mm = mkt(b, m); return ((mm && mm.outcomes) || []).filter(o => !/^no$|no goal/i.test(o.name || '') && !/no goal/i.test(o.description || '')).map(o => ({ n: o.description || o.name, price: o.price })).filter(o => o.n && Number.isFinite(o.price)); };
                // one entry per player: price = DraftKings, fd = FanDuel, cz = Caesars, fn = Fanatics, sc = theScore Bet (any can be missing)
                const XB = [['williamhill_us', 'cz'], ['fanatics', 'fn'], ['espnbet', 'sc']];
                const merge = m => { const map = new Map(); for (const o of outs(book('draftkings'), m)) map.set(nn(o.n), { n: o.n, price: o.price });
                  for (const [bk, f] of [['fanduel', 'fd'], ...XB]) for (const o of outs(book(bk), m)) { const k = nn(o.n), x = map.get(k) || { n: o.n, price: null }; x[f] = o.price; map.set(k, x); }
                  return [...map.values()]; };
                const players = merge('player_goal_scorer_anytime'), first = merge('player_goal_scorer_first');
                // shots on goal: per player, per book: [line, over price, under price] (each book's main line)
                const sogMap = new Map(), imp = v => v < 0 ? -v / (-v + 100) : 100 / (v + 100);
                for (const [bk, f] of [['draftkings', 'dk'], ['fanduel', 'fd'], ...XB]) {
                  const mm = mkt(book(bk), 'player_shots_on_goal'); if (!mm) continue;
                  const by = {}; for (const o of mm.outcomes || []) { const n = o.description; if (!n || !Number.isFinite(o.price) || !Number.isFinite(o.point)) continue; const side = /^over$/i.test(o.name) ? 'o' : /^under$/i.test(o.name) ? 'u' : null; if (!side) continue; const b = by[nn(n)] || (by[nn(n)] = { n, lines: {} }); const L = b.lines[o.point] || (b.lines[o.point] = {}); L[side] = o.price; }
                  for (const [k, b] of Object.entries(by)) {
                    // the main line: the one with both sides whose prices are closest to even
                    const best = Object.entries(b.lines).filter(([, L]) => L.o != null && L.u != null).sort((x, y) => Math.abs(imp(x[1].o) - imp(x[1].u)) - Math.abs(imp(y[1].o) - imp(y[1].u)))[0]; if (!best) continue;
                    const x = sogMap.get(k) || { n: b.n }; x[f] = [+best[0], best[1].o, best[1].u]; sogMap.set(k, x);
                  }
                }
                const sog = [...sogMap.values()];
                const h2h = b => { const mm = mkt(b, 'h2h'); if (!mm) return null; const f = nm => (mm.outcomes.find(o => o.name === nm) || {}).price; const h = f(e.home_team), a = f(e.away_team); return Number.isFinite(h) && Number.isFinite(a) ? { h, a } : null; };
                const mk = mkt(book('draftkings'), 'player_goal_scorer_anytime') || mkt(book('fanduel'), 'player_goal_scorer_anytime');
                games.push({ id: e.id, commence: e.commence_time, home: e.home_team, away: e.away_team, updated: mk ? mk.last_update : null, players, first, sog, ml: { dk: h2h(book('draftkings')), fd: h2h(book('fanduel')), cz: h2h(book('williamhill_us')), fn: h2h(book('fanatics')), sc: h2h(book('espnbet')) } });
                const c = (l, k) => l.filter(x => x[k] != null).length;
                console.log(`${e.away_team} @ ${e.home_team}: anytime DK ${c(players, 'price')} / FD ${c(players, 'fd')} / CZ ${c(players, 'cz')} / FAN ${c(players, 'fn')} / SCR ${c(players, 'sc')}, first goal DK ${c(first, 'price')} / FD ${c(first, 'fd')} / CZ ${c(first, 'cz')} / FAN ${c(first, 'fn')} / SCR ${c(first, 'sc')}, shots on goal DK ${c(sog, 'dk')} / FD ${c(sog, 'fd')} / CZ ${c(sog, 'cz')} / FAN ${c(sog, 'fn')} / SCR ${c(sog, 'sc')}`);
              } catch (err) { console.log(`::warning::${e.away_team} @ ${e.home_team}: ${err.message}`); }
            }
            const out = { source: 'DraftKings, FanDuel, Caesars, Fanatics and theScore Bet via The Odds API', updated: new Date().toISOString(), remaining, games };
            fs.writeFileSync('props.json', JSON.stringify(out));
            console.log(`Saved ${games.reduce((s, g) => s + g.players.length, 0)} player prices for ${games.length} games.`);
          })().catch(err => { console.log('::error::' + err.message); process.exit(1); });
          EOF

      - name: Fetch Post Hockey skater ratings
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/ph.js" <<'EOF'
          // Post Hockey skater ratings and team stats (used with permission): this season and the three before, regular season.
          const fs = require('fs');
          const log = (...a) => console.log(...a);
          async function run({ fetchImpl = fetch, now = new Date() } = {}) {
            const y = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1, code = k => `${y - k}${y - k + 1}`;
            let old = {}; try { old = JSON.parse(fs.readFileSync('posthockey.json', 'utf8')).seasons || {}; } catch (e) {}
            const out = { source: 'Post Hockey (posthockey.com), used with permission', updated: now.toISOString(), cols: ['n', 'tm', 'pos', 'gp', 'toi', 'o', 'd', 'net', 'est', 'sh'], seasons: {} };
            for (const k of [0, 1, 2, 3]) {
              const s = code(k);
              if (k >= 2 && old[s] && old[s].length) { out.seasons[s] = old[s]; log(`${s}: kept ${old[s].length} saved players`); continue; } // finished seasons don't change
              const rows = [];
              for (let off = 0; off < 3000; off += 500) {
                const url = `https://posthockey.com/api/v1/stats/leaders?stat=est_net_rating&season=${s}&game_type=2&strength=all&position=S&min_gp=1&min_toi=0&sort_dir=desc&limit=500&offset=${off}`;
                let j = null;
                for (let t = 0; t < 3 && !j; t++) { try { const r = await fetchImpl(url, { headers: { 'User-Agent': 'NHL-Ice-Lab (personal dashboard; permission granted)' } }); if (r.ok) j = await r.json(); else log(`${s}: HTTP ${r.status}`); } catch (e) { log(`${s}: ${e.message}`); } if (!j) await new Promise(r => setTimeout(r, 2000)); }
                if (!j) break;
                for (const r of j.rows || []) rows.push([`${r.first_name || ''} ${r.last_name || ''}`.trim(), r.team_abbreviation || '', r.position || '', r.games_played || 0, r.toi_seconds || 0, r.o_rating, r.d_rating, r.net_rating_v2, r.est_net_rating, r.current_shooter_talent]);
                if ((j.rows || []).length < 500 || rows.length >= (j.total || 0)) break;
                await new Promise(r => setTimeout(r, 500)); // be polite
              }
              if (rows.length) { out.seasons[s] = rows; log(`${s}: ${rows.length} skaters`); }
              else if (old[s]) { out.seasons[s] = old[s]; log(`${s}: fetch failed, kept saved copy`); }
            }
            // team stats: 5v5, power play, penalty kill and all situations (season to date)
            let oldAll = {}; try { oldAll = JSON.parse(fs.readFileSync('posthockey.json', 'utf8')); } catch (e) {}
            out.teamCols = ['tm', 'gp', 'toi', 'xgf', 'xga', 'gf', 'ga', 'cf', 'ca', 'gsax'];
            out.teams = {};
            for (const k of [0, 1, 2, 3]) {
              const s = code(k), prev = (oldAll.teams || {})[s];
              if (k >= 1 && prev && prev['5v5']) { out.teams[s] = prev; continue; } // finished seasons don't change
              const t = {};
              for (const st of ['5v5', 'pp', 'pk', 'all']) {
                const url = `https://posthockey.com/api/v1/teams/leaders?stat=xgf_pct_fully_adj&season=${s}&game_type=2&strength=${st}&min_gp=1&sort_dir=desc&limit=200`;
                try { const r = await fetchImpl(url, { headers: { 'User-Agent': 'NHL-Ice-Lab (personal dashboard; permission granted)' } }); if (r.ok) { const j = await r.json(); t[st] = (j.rows || []).map(x => [x.team_abbreviation, x.games_played || 0, x.toi_seconds || 0, x.xgf, x.xga, x.gf, x.ga, x.cf, x.ca, x.gsax_shooter_adj]); } else log(`teams ${s} ${st}: HTTP ${r.status}`); } catch (e) { log(`teams ${s} ${st}: ${e.message}`); }
                await new Promise(r => setTimeout(r, 400));
              }
              if (t['5v5'] && t['5v5'].length) { out.teams[s] = t; log(`teams ${s}: ${t['5v5'].length} teams`); } else if (prev) out.teams[s] = prev;
            }
            // a dated snapshot of this season's team stats each run, so the game model can use them walk-forward (only what was known that day)
            out.teamHist = oldAll.teamHist || {};
            const cur = out.teams[code(0)];
            if (cur && cur['5v5']) {
              const day = now.toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).replace(/-/g, ''), snap = {};
              const by = (st, tm) => (cur[st] || []).find(r => r[0] === tm);
              for (const r of cur['5v5']) { const pp = by('pp', r[0]), pk = by('pk', r[0]); snap[r[0]] = [r[1], r[2], r[3], r[4], pp ? pp[2] : 0, pp ? pp[3] : 0, pk ? pk[2] : 0, pk ? pk[4] : 0]; }
              out.teamHist[day] = { s: code(0), t: snap };
            }
            out.teamHistCols = ['gp', 'toi5', 'xgf5', 'xga5', 'toiPP', 'xgfPP', 'toiPK', 'xgaPK'];
            if (Object.keys(out.seasons).length || Object.keys(out.teams).length) fs.writeFileSync('posthockey.json', JSON.stringify(out));
            return out;
          }
          module.exports = { run };
          if (require.main === module) run().then(() => process.exit(0)).catch(e => { console.log('::warning::' + (e.stack || e.message)); process.exit(0); });
          EOF
          node "$RUNNER_TEMP/ph.js"

      - name: Restore saved game data
        uses: actions/cache@v4
        with:
          path: .cache
          key: espn-games-${{ github.run_id }}
          restore-keys: espn-games-

      - name: Period ice time from NHL shift charts
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/shifts.js" <<'EOF'
          // Period-by-period ice time for every skater, from the NHL's public shift charts (this season and the two before).
          // Saves per-game totals in the GitHub cache (so each game is downloaded once) and adds season totals to props.json.
          const fs = require('fs');
          const log = (...a) => console.log(...a);
          const K = 6.1 / 3600, I = (1 - Math.exp(-K * 1200)) / K; // league goals per second (both teams); exposure of a full first period
          const toS = t => { if (!t) return 0; const [m, s] = String(t).split(':').map(Number); return (m || 0) * 60 + (s || 0); };
          const etDay = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
          const addDay = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
          async function pool(items, n, fn) { const out = []; let i = 0; await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k]); } })); return out; }
          // one game's shifts → per player [name, team, P1, P2, P3, OT seconds, early-weighted P1 exposure, on ice at opening faceoff]
          function aggGame(rows) {
            const pl = {};
            for (const r of rows || []) {
              if (r.typeCode !== 517 || !r.playerId) continue;
              const a = toS(r.startTime), b = toS(r.endTime), dur = r.duration ? toS(r.duration) : Math.max(0, b - a);
              const o = pl[r.playerId] || (pl[r.playerId] = [`${r.firstName || ''} ${r.lastName || ''}`.trim(), r.teamAbbrev || '', 0, 0, 0, 0, 0, 0]);
              const per = r.period >= 4 ? 5 : r.period + 1; if (per < 2) continue;
              o[per] += dur;
              if (r.period === 1) { const end = a + dur; o[6] += (Math.exp(-K * a) - Math.exp(-K * end)) / K; if (a === 0) o[7] = 1; }
            }
            for (const o of Object.values(pl)) o[6] = Math.round(o[6]);
            return pl;
          }
          async function run({ fetchImpl = fetch, now = new Date(), budgetMs = 12 * 60e3 } = {}) {
            const t0 = Date.now(), y = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1, today = etDay(now);
            let C = { days: {}, games: {} }; try { C = JSON.parse(fs.readFileSync('.cache/shifts.json', 'utf8')); } catch (e) {}
            C.days = C.days || {}; C.games = C.games || {};
            // the NHL's servers rate-limit bursts: retry a failed request after a pause (longer each time, or what the server asks for)
            const errs = [];
            const getJ = async url => {
              for (let t = 0; ; t++) {
                let r = null, err = null;
                try { r = await fetchImpl(url); } catch (e) { err = e.message; }
                if (r && r.ok) return r.json();
                const st = r ? r.status : 0, retry = !r || st === 429 || st >= 500;
                if (!retry || t >= 4) { const m = err || 'HTTP ' + st; if (errs.length < 5) errs.push(`${m} (${url.replace(/^https:\/\/[^/]+/, '').slice(0, 60)})`); throw new Error(m); }
                const ra = r && r.headers && r.headers.get ? parseFloat(r.headers.get('retry-after')) : NaN;
                await new Promise(res => setTimeout(res, Number.isFinite(ra) ? Math.min(30, ra) * 1000 : 1500 * 2 ** t));
              }
            };
            let fetched = 0, failed = 0, stopped = false;
            for (const k of [0, 1, 2]) {
              const code = `${y - k}${y - k + 1}`, end = k ? `${y - k + 1}-06-30` : today;
              const days = []; for (let d = `${y - k}-09-25`; d <= end; d = addDay(d, 1)) if (!C.days[d]) days.push(d);
              await pool(days, 6, async d => {
                if (Date.now() - t0 > budgetMs) { stopped = true; return; }
                let sc; try { sc = await getJ(`https://api-web.nhle.com/v1/score/${d}`); } catch (e) { failed++; return; }
                const gs = (sc.games || []).filter(g => (g.gameType === 2 || g.gameType === 3));
                let allDone = d < today;
                for (const g of gs) {
                  if (!/^(OFF|FINAL)$/.test(g.gameState || '')) { allDone = false; continue; }
                  if (C.games[g.id]) continue;
                  if (Date.now() - t0 > budgetMs) { stopped = true; allDone = false; break; }
                  try {
                    const j = await getJ(`https://api.nhle.com/stats/rest/en/shiftcharts?cayenneExp=gameId=${g.id}`);
                    const pl = aggGame(j.data);
                    if (Object.keys(pl).length < 20) { allDone = false; continue; } // shift charts not posted yet
