      - name: Line combinations from NHL shift charts and play-by-play
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/combos.js" <<'EOF'
          // Line combinations: how each forward line (trio) and defense pair actually does at 5-on-5 when it's on the ice together.
          // Matches the NHL's shift charts (who was on the ice each second) with its play-by-play (every shot attempt and goal).
          // Per-game results are saved in the GitHub cache, so each game is downloaded once; season totals go into props.json → combos.
          const fs = require('fs');
          const log = (...a) => console.log(...a);
          const toS = t => { if (!t) return 0; const [m, s] = String(t).split(':').map(Number); return (m || 0) * 60 + (s || 0); };
          const etDay = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
          const addDay = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
          async function pool(items, n, fn) { let i = 0; await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) { const k = i++; await fn(items[k]); } })); }
          const FWD = new Set(['C', 'L', 'R']);
          // simple shot quality (chance an unblocked attempt becomes a goal): distance, angle, shot type, rebound. Scaled to real goals later.
          function xgOf(dist, ang, type, reb) {
            let z = -0.6 - 0.065 * dist - 0.01 * ang;
            if (/tip|deflect/i.test(type || '')) z += 0.3; else if (/wrap/i.test(type || '')) z -= 0.5; else if (/backhand/i.test(type || '')) z -= 0.15;
            if (reb) z += 0.8;
            return 1 / (1 + Math.exp(-z));
          }
          // one game → { tri, pr, pl } stats at 5-on-5. Each stat row: [toi sec, CF, CA, SF, SA, GF, GA, xGF, xGA]
          function gameCombos(shiftRows, pbp) {
            const pos = {}, team = {}, name = {};
            for (const r of pbp.rosterSpots || []) { pos[r.playerId] = r.positionCode; team[r.playerId] = r.teamId; name[r.playerId] = `${(r.firstName && r.firstName.default) || ''} ${(r.lastName && r.lastName.default) || ''}`.trim(); }
            const H = pbp.homeTeam.id, A = pbp.awayTeam.id, ab = { [H]: pbp.homeTeam.abbrev, [A]: pbp.awayTeam.abbrev };
            const shifts = []; let maxT = 0;
            for (const r of shiftRows || []) {
              if (r.typeCode !== 517 || !r.playerId || !(r.period >= 1 && r.period <= 4)) continue; // regulation + regular-season overtime (no shootout)
              const off = (r.period - 1) * 1200, a = off + toS(r.startTime), b = off + toS(r.endTime);
              if (!(b > a)) continue;
              const tm = team[r.playerId] || null, p = pos[r.playerId]; if (!tm || !p) continue;
              shifts.push({ id: r.playerId, tm, p, a, b }); if (b > maxT) maxT = b;
            }
            if (shifts.length < 200) return null; // shift charts incomplete
            const z = () => [0, 0, 0, 0, 0, 0, 0, 0, 0];
            const out = { tri: {}, pr: {}, pl: {}, names: {}, tm: ab };
            const row = (o, k) => o[k] || (o[k] = z());
            // who is on the ice: each second for ice time (start ≤ s < end), at an event's moment for shots (start < t ≤ end)
            const sec = Array.from({ length: maxT + 1 }, () => []);
            for (const s of shifts) for (let t = s.a; t < s.b && t <= maxT; t++) sec[t].push(s);
            const split = list => { const by = { [H]: { f: [], d: [], g: 0 }, [A]: { f: [], d: [], g: 0 } }; for (const s of list) { const x = by[s.tm]; if (!x) continue; if (s.p === 'G') x.g++; else if (s.p === 'D') x.d.push(s.id); else if (FWD.has(s.p)) x.f.push(s.id); } return by; };
            const hasG = { [H]: shifts.some(s => s.tm === H && s.p === 'G'), [A]: shifts.some(s => s.tm === A && s.p === 'G') }; // some shift charts leave goalies out
            const is5v5 = by => [H, A].every(t => by[t].f.length + by[t].d.length === 5 && (!hasG[t] || by[t].g === 1));
            const kTri = l => l.length === 3 ? [...l].sort((x, y) => x - y).join('-') : null, kPr = l => l.length === 2 ? [...l].sort((x, y) => x - y).join('-') : null;
            for (let t = 0; t <= maxT; t++) {
              const by = split(sec[t]); if (!is5v5(by)) continue;
              for (const tm of [H, A]) {
                const x = by[tm], kt = kTri(x.f), kp = kPr(x.d);
                if (kt) row(out.tri, tm + '|' + kt)[0]++;
                if (kp) row(out.pr, tm + '|' + kp)[0]++;
                for (const id of [...x.f, ...x.d]) row(out.pl, tm + '|' + id)[0]++;
              }
            }
            // shots: 5-on-5 situation code 1551 (one goalie and five skaters each side)
            let lastUnblocked = null;
            for (const p of pbp.plays || []) {
              const k = p.typeDescKey; if (!/^(shot-on-goal|missed-shot|blocked-shot|goal)$/.test(k)) continue;
              const per = p.periodDescriptor && p.periodDescriptor.number; if (!(per >= 1 && per <= 4)) continue;
              const t = (per - 1) * 1200 + toS(p.timeInPeriod), d = p.details || {};
              const shooter = d.shootingPlayerId || d.scoringPlayerId, tm = team[shooter] || d.eventOwnerTeamId; if (tm !== H && tm !== A) continue;
              const blocked = k === 'blocked-shot';
              let xg = 0;
              if (!blocked) {
                const homeShoots = tm === H, netX = (p.homeTeamDefendingSide === 'right') === homeShoots ? -89 : 89;
                const dx = Math.abs(netX - (d.xCoord || 0)), dy = Math.abs(d.yCoord || 0), dist = Math.hypot(dx, dy), ang = dx > 0 ? Math.atan(dy / dx) * 180 / Math.PI : 90;
                const reb = lastUnblocked && lastUnblocked.tm === tm && t - lastUnblocked.t <= 3;
                xg = xgOf(dist, ang, d.shotType, reb); lastUnblocked = { tm, t };
              }
              if (p.situationCode !== '1551') continue;
              const on = split(shifts.filter(s => s.a < t && t <= s.b)); if (!is5v5(on)) continue;
              const opp = tm === H ? A : H, sog = k === 'shot-on-goal' || k === 'goal', goal = k === 'goal';
              const add = (r, f) => { const o = f ? 0 : 1; r[1 + o]++; if (sog) r[3 + o]++; if (goal) r[5 + o]++; r[7 + o] += xg; };
