
# Updates lines.json with today's NHL forward lines, defense pairs and goalies from RotoGrinders
# (every 30 minutes from 10 AM to midnight Eastern), and props.json with DraftKings anytime goal scorer
# odds from The Odds API (twice a day, about 11 AM and 5 PM Eastern). The same run saves the goal scorer model's
# pre-game picks with DraftKings prices to picks.json and grades finished games. In the evening, every 30 minutes, the
# close job records the price just before puck drop for saved picks (closing line value). All run on demand from the Actions tab.
name: Update NHL lines

on:
  schedule:
    - cron: '*/30 14-23 * * *'
    - cron: '*/30 0-4 * * *'
    - cron: '7 15 * * *'
    - cron: '7 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhl-lines
  cancel-in-progress: false

jobs:
  lines:
    if: github.event.schedule != '7 15 * * *' && github.event.schedule != '7 21 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch and parse today's lines
        run: |
          node <<'EOF'
          const fs = require('fs');
          const PAGE_URL = 'https://rotogrinders.com/lineups/nhl';

          function parseLines(html) {
            const dec = s => s.replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&#0?39;|&apos;/g, "'").replace(/&quot;/g, '"')
              .replace(/&#(\d+);/g, (m, n) => String.fromCharCode(+n)).replace(/\s+/g, ' ').trim();
            const games = [];
            for (const b of html.split(/class="module game-card"/).slice(1)) {
              const cities = [...b.matchAll(/class="team-nameplate-city"[^>]*>([\s\S]*?)<\/span>/g)].map(m => dec(m[1]));
              const mascots = [...b.matchAll(/class="team-nameplate-mascot"[^>]*>([\s\S]*?)<\/span>/g)].map(m => dec(m[1]));
              const teams = cities.slice(0, 2).map((c, i) => `${c} ${mascots[i] || ''}`.trim());
              const time = (b.match(/(\d{1,2}:\d{2}\s*[AP]M(?:\s*ET)?)/) || [])[1] || '';
              const cards = b.split(/class="lineup-card"/).slice(1, 3).map(c => {
                const head = c.split(/class="lineup-card-body/)[0] || '';
                const body = c.split(/class="lineup-card-body/)[1] || '';
                const gm = head.match(/player-nameplate-name"[^>]*>([\s\S]*?)<\/a>/);
                const groups = []; let cur = null, m;
                const re = /<span class="bold small[^"]*"[^>]*>\s*([^<]+?)\s*<\/span>|<li class="lineup-card-player"[^>]*>([\s\S]*?)<\/li>/g;
                while ((m = re.exec(body))) {
                  if (m[1]) { cur = { label: dec(m[1]), players: [] }; groups.push(cur); continue; }
                  const name = (m[2].match(/player-nameplate-name"[^>]*>([\s\S]*?)<\/a>/) || [])[1];
                  if (!name) continue;
                  if (!cur) { cur = { label: 'Lineup', players: [] }; groups.push(cur); }
                  cur.players.push({ n: dec(name), pos: (m[2].match(/data-position="([^"]+)"/) || [])[1] || '', pp: (m[2].match(/>\s*(PP\d)\s*</) || [])[1] || '' });
                }
                return { goalie: gm ? dec(gm[1]) : '', groups };
              });
              if (teams.length === 2 && cards.length) games.push({ time, away: teams[0], home: teams[1], teams: cards.map((c, i) => ({ team: teams[i], ...c })) });
            }
            return games;
          }

          (async () => {
            const headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.9',
              'Referer': 'https://rotogrinders.com/'
            };
            let html = null;
            for (let attempt = 1; attempt <= 3 && html == null; attempt++) {
              try {
                const res = await fetch(PAGE_URL, { headers });
                const text = await res.text();
                if (res.ok && text.includes('game-card')) { html = text; break; }
                console.log(`Attempt ${attempt}: HTTP ${res.status}, ${text.length} bytes. Page starts with: ${text.slice(0, 300).replace(/\s+/g, ' ')}`);
              } catch (e) { console.log(`Attempt ${attempt}: network error: ${e.message}`); }
              await new Promise(r => setTimeout(r, 5000 * attempt));
            }
            if (html == null) { console.error('::error::Could not read the RotoGrinders lineups page (see the attempts above).'); process.exit(1); }
            const games = parseLines(html);
            if (!games.length) console.log('::warning::Page loaded but no games were found. There may be no games today, or the page layout changed.');
            const date = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
            let old = null; try { old = JSON.parse(fs.readFileSync('lines.json', 'utf8')); } catch (e) {}
            if (old && old.date === date && JSON.stringify(old.games) === JSON.stringify(games)) { console.log('No changes.'); return; }
            fs.writeFileSync('lines.json', JSON.stringify({ source: 'RotoGrinders', url: PAGE_URL, date, updated: new Date().toISOString(), games }, null, 1));
            console.log(`Saved ${games.length} games for ${date}.`);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add lines.json
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Update NHL lines"
          git pull --rebase --quiet || true
          git push || { echo "::error::Push failed. In the repo go to Settings > Actions > General > Workflow permissions, choose 'Read and write permissions', and run again."; exit 1; }

  props:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 15 * * *' || github.event.schedule == '7 21 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch DraftKings anytime goal scorer odds
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const KEY = process.env.ODDS_API_KEY;
          if (!KEY) { console.log('::error::No ODDS_API_KEY secret. Add it under Settings > Secrets and variables > Actions.'); process.exit(1); }
          const BASE = 'https://api.the-odds-api.com/v4/sports/icehockey_nhl';
          const get = async url => {
            const r = await fetch(url);
            const left = r.headers.get('x-requests-remaining'), used = r.headers.get('x-requests-used');
            if (left) console.log(`Odds API requests used: ${used}, remaining: ${left}`);
            if (!r.ok) throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0, 200)}`);
            return { data: await r.json(), left };
          };
          (async () => {
            // events list (does not count against the quota)
            const { data: events } = await get(`${BASE}/events?apiKey=${KEY}`);
            const now = Date.now(), soon = events.filter(e => { const t = new Date(e.commence_time).getTime(); return t > now - 3600e3 && t < now + 30 * 3600e3; });
            console.log(`${events.length} upcoming events, ${soon.length} in the next 30 hours`);
            const games = []; let remaining = null;
            for (const e of soon) {
              try {
                const { data, left } = await get(`${BASE}/events/${e.id}/odds?apiKey=${KEY}&regions=us&markets=player_goal_scorer_anytime&bookmakers=draftkings&oddsFormat=american`);
                remaining = left ?? remaining;
                const bk = (data.bookmakers || []).find(b => b.key === 'draftkings');
                const mk = bk && (bk.markets || []).find(m => m.key === 'player_goal_scorer_anytime');
                const players = ((mk && mk.outcomes) || [])
                  .filter(o => !/^no$/i.test(o.name || ''))
                  .map(o => ({ n: o.description || o.name, price: o.price }))
                  .filter(o => o.n && Number.isFinite(o.price));
                games.push({ id: e.id, commence: e.commence_time, home: e.home_team, away: e.away_team, updated: mk ? mk.last_update : null, players });
                console.log(`${e.away_team} @ ${e.home_team}: ${players.length} players`);
              } catch (err) { console.log(`::warning::${e.away_team} @ ${e.home_team}: ${err.message}`); }
            }
            const out = { source: 'DraftKings via The Odds API', updated: new Date().toISOString(), remaining, games };
            fs.writeFileSync('props.json', JSON.stringify(out));
            console.log(`Saved ${games.reduce((s, g) => s + g.players.length, 0)} player prices for ${games.length} games.`);
          })().catch(err => { console.log('::error::' + err.message); process.exit(1); });
          EOF

      - name: Fetch Post Hockey skater ratings
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/ph.js" <<'EOF'
          // Post Hockey skater ratings (used with permission): this season and the two before, regular season, all situations.
          const fs = require('fs');
          const log = (...a) => console.log(...a);
          async function run({ fetchImpl = fetch, now = new Date() } = {}) {
            const y = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1, code = k => `${y - k}${y - k + 1}`;
            let old = {}; try { old = JSON.parse(fs.readFileSync('posthockey.json', 'utf8')).seasons || {}; } catch (e) {}
            const out = { source: 'Post Hockey (posthockey.com), used with permission', updated: now.toISOString(), cols: ['n', 'tm', 'pos', 'gp', 'toi', 'o', 'd', 'net', 'est', 'sh'], seasons: {} };
            for (const k of [0, 1, 2]) {
              const s = code(k);
              if (k >= 2 && old[s] && old[s].length) { out.seasons[s] = old[s]; log(`${s}: kept ${old[s].length} saved players`); continue; } // finished seasons don't change
              const rows = [];
              for (let off = 0; off < 3000; off += 500) {
                const url = `https://posthockey.com/api/v1/stats/leaders?stat=est_net_rating&season=${s}&game_type=2&strength=all&position=S&min_gp=1&min_toi=0&sort_dir=desc&limit=500&offset=${off}`;
                let j = null;
                for (let t = 0; t < 3 && !j; t++) { try { const r = await fetchImpl(url, { headers: { 'User-Agent': 'NHL-Ice-Lab (personal dashboard; permission granted)' } }); if (r.ok) j = await r.json(); else log(`${s}: HTTP ${r.status}`); } catch (e) { log(`${s}: ${e.message}`); } if (!j) await new Promise(r => setTimeout(r, 2000)); }
                if (!j) break;
                for (const r of j.rows || []) rows.push([`${r.first_name || ''} ${r.last_name || ''}`.trim(), r.team_abbreviation || '', r.position || '', r.games_played || 0, r.toi_seconds || 0, r.o_rating, r.d_rating, r.net_rating_v2, r.est_net_rating, r.current_shooter_talent]);
                if ((j.rows || []).length < 500 || rows.length >= (j.total || 0)) break;
                await new Promise(r => setTimeout(r, 500)); // be polite
              }
              if (rows.length) { out.seasons[s] = rows; log(`${s}: ${rows.length} skaters`); }
              else if (old[s]) { out.seasons[s] = old[s]; log(`${s}: fetch failed, kept saved copy`); }
            }
            if (Object.keys(out.seasons).length) fs.writeFileSync('posthockey.json', JSON.stringify(out));
            return out;
          }
          module.exports = { run };
          if (require.main === module) run().then(() => process.exit(0)).catch(e => { console.log('::warning::' + (e.stack || e.message)); process.exit(0); });
          EOF
          node "$RUNNER_TEMP/ph.js"

      - name: Restore saved game data
        uses: actions/cache@v4
        with:
          path: .cache
          key: espn-games-${{ github.run_id }}
          restore-keys: espn-games-

      - name: Install page runner
        run: npm install --prefix "$RUNNER_TEMP/tk" jsdom@24 --no-audit --no-fund --silent

      - name: Save and grade goal scorer and game model picks
        run: |
          cat > "$RUNNER_TEMP/track.js" <<'EOF'
          // Pick tracker: runs the dashboard's own models (from index.html) headlessly. Saves today's pre-game goal scorer picks
          // (DraftKings prices) and Game model v2 moneyline picks to picks.json, grades finished ones, and records each day's
          // model test scores so the dashboard can chart accuracy over time.
          const fs = require('fs');
          const { JSDOM } = require('jsdom');
          const ET = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).replace(/-/g, '');
          const readJSON = (f, dflt) => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch (e) { return dflt; } };
          const log = (...a) => console.log(...a);

          async function boot(fetchImpl) {
            const html = fs.readFileSync('index.html', 'utf8');
            const dom = new JSDOM(html.replace(/<link[^>]+fonts[^>]*>/g, ''), { runScripts: 'outside-only', url: 'https://example.org/' });
            const w = dom.window;
            w.fetch = async (u, o) => {
              const url = String(u);
              if (!/^https?:/.test(url)) { // local files: lines.json, props.json
                const f = url.split('?')[0]; const ok = fs.existsSync(f);
                return { ok, status: ok ? 200 : 404, json: async () => JSON.parse(fs.readFileSync(f, 'utf8')) };
              }
              return fetchImpl(url, o);
            };
            w.matchMedia = () => ({ matches: false, addEventListener() {} }); w.scrollTo = () => {};
            w.addEventListener('error', e => log('page error:', e.message));
            const script = html.split('<script>')[1].split('</script>')[0];
            w.eval(script + `;window.__t = { A, S, VER, API, ensureData, gsGetState, gsTonight, GM, gmCollect, gmTrain, gmEventPick, getInjuries, gsBlendFit, GS, gsMateMap, seasonOf, fixFinal, getPHFile, PHF, gsRoster, gsGoalie, gsLambda, dkPriceMap, dkLookup, amImplied, betEV, probableGoalies, getJSON, getGame, addTeam, TM, fairAmerican };`);
            return w.__t;
          }

          async function run({ fetchImpl = fetch, now = new Date(), preload } = {}) {
            const T = await boot(fetchImpl);
            await new Promise(r => setTimeout(r, 4000)); // let the page find the current season
            if (!T.S.curSeason) { const d = new Date(); T.S.curSeason = d.getMonth() >= 7 ? d.getFullYear() + 1 : d.getFullYear(); }
            T.A.season = T.S.curSeason; T.A.range = 'season'; T.A.types = 'reg'; T.A.note = '';
            // saved processed games from earlier runs (GitHub cache) so only new games are downloaded
            const cache = readJSON('.cache/games.json', []);
            let pre = 0; for (const g of cache) if (g && g.v === T.VER && g.final) { T.A.games.set(g.id, T.fixFinal(g)); T.addTeam(g.home); T.addTeam(g.away); pre++; }
            log(`Loaded ${pre} saved games from cache.`);
            if (preload) await preload(T); else await T.ensureData(true);
            log(`Model data: ${T.A.filtered.length} completed games this season.`);
            // game model: last season + this season (saved games come from the cache)
            let gmOK = false;
            await T.getPHFile(); log(T.PHF.idx ? `Post Hockey ratings loaded: ${Object.entries(T.PHF.data.seasons).map(([k, v]) => k + ' ' + v.length).join(', ')}` : 'No Post Hockey ratings file.');
            try {
              const all = preload ? [...T.A.games.values()].filter(g => g && g.final) : await T.gmCollect(() => {});
              const M = T.gmTrain(all);
              if (M.error) log('Game model: ' + M.error); else { T.GM.model = M; gmOK = true; log(`Game model trained on ${M.nRows} games · test accuracy ${(M.sKeep.acc * 100).toFixed(1)}%`); }
            } catch (e) { log('Game model error: ' + (e.stack || e.message)); }
            fs.mkdirSync('.cache', { recursive: true });
            fs.writeFileSync('.cache/games.json', JSON.stringify([...T.A.games.values()].filter(g => g && g.final)));

            const picks = readJSON('picks.json', { picks: [] });
            const byKey = new Map((picks.picks || []).map(p => [p.k, p])), gByKey = new Map((picks.games || []).map(g => [g.k, g]));

            // 1) today's pre-game picks
            const today = ET(now);
            let sb = null; try { sb = await T.getJSON(`${T.API}/scoreboard?dates=${today}`); } catch (e) { log('Scoreboard error: ' + e.message); }
            const PF = readJSON('props.json', null), LF = readJSON('lines.json', null);
            let added = 0, updated = 0, gAdded = 0;
            T.gsBlendFit(picks); log(`Goal scorer chances: ${Math.round(T.GS.blendW * 100)}% model / ${Math.round((1 - T.GS.blendW) * 100)}% DraftKings (learned from ${T.GS.blendN} graded picks).`);
            // last season is the goal scorer model's starting point (counted at half weight)
            T.GS.prior = [...T.A.games.values()].filter(g => g && g.final && T.seasonOf(g.date) === T.S.curSeason - 1);
            const gs = T.A.filtered.length || T.GS.prior.length ? T.gsGetState() : null;
            if (gs) log(`Goal scorer model: ${T.A.filtered.length} games this season + ${T.GS.prior.length} from last season.`);
            const MATE = gs && sb ? T.gsMateMap(gs.S, LF, sb.events || []) : null;
            if (sb) for (const e of sb.events || []) {
              const c = e.competitions[0];
              if (c.status.type.state !== 'pre' || new Date(e.date) <= now) continue; // only games that haven't started
              const inj = await T.getInjuries(e.id);
              // game model moneyline pick
              if (gmOK) {
                const gp = T.gmEventPick(e, inj, LF);
                if (gp && gp.ml) {
                  const k = 'g|' + e.id, out = [...gp.r.inj.h.who, ...gp.r.inj.a.who].map(w => w.n);
                  const rec = { k, date: today, gid: String(e.id), start: e.date, h: gp.H, a: gp.Aw, ha: gp.ha, aa: gp.aa, mlH: gp.ml.h, mlA: gp.ml.a, p: +gp.r.p.toFixed(4), p0: +gp.r.p0.toFixed(4), pb: Number.isFinite(gp.r.pb) ? +gp.r.pb.toFixed(4) : null, mk: Number.isFinite(gp.r.mk) ? +gp.r.mk.toFixed(4) : null, side: gp.side.s, edge: +gp.side.edge.toFixed(4), verdict: gp.verdict, gH: gp.gHn, gA: gp.gAn, inj: out, refs: gp.r.ref.names, crew: +gp.r.ref.crew.toFixed(3), hw: null, saved: now.toISOString() };
                  if (!gByKey.has(k) || gByKey.get(k).hw == null) { if (!gByKey.has(k)) gAdded++; gByKey.set(k, rec); }
                }
              }
              if (gs) {
                const rows = T.gsTonight(gs.S, e, LF, PF, inj, MATE).filter(r => r.dk != null);
                if (!rows.length) { log(`Game ${e.id}: no DraftKings prices matched yet`); continue; }
                for (const r of rows) {
                  const k = `${e.id}|${r.pid}`;
                  const rec = { k, date: today, gid: String(e.id), start: e.date, pid: r.pid, n: r.n, pos: r.pos, tm: r.tm, opp: r.opp, gl: r.gl ? r.gl.n : '', glSt: r.gl ? r.gl.st || '' : '', role: r.role || '', gp: r.gp, crew: +(r.crew || 1).toFixed(3), p: +r.p.toFixed(4), pRaw: +r.pModel.toFixed(4), fair: +r.dkFair.toFixed(4), dk: r.dk, imp: +r.dkImp.toFixed(4), edge: +r.edgeP.toFixed(4), ev: +r.ev.toFixed(2), roi: +r.roi.toFixed(4), res: null, saved: now.toISOString() };
                  if (byKey.has(k)) { if (byKey.get(k).res == null) { Object.assign(byKey.get(k), rec); updated++; } } else { byKey.set(k, rec); added++; }
                }
              }
            }
            log(`Goal scorer picks saved: ${added} new, ${updated} refreshed. Game picks: ${gAdded} new.`);

            // 2) grade finished games
            let graded = 0;
            const open = [...byKey.values()].filter(p => p.res == null && new Date(p.start) < new Date(now - 4 * 3600e3));
            const gids = [...new Set(open.map(p => p.gid))];
            for (const gid of gids) {
              let g = null; try { g = await T.getGame(gid); } catch (e) { log(`Game ${gid}: ${e.message}`); }
              if (!g || !g.final) continue;
              for (const p of open.filter(x => x.gid === gid)) {
                const s = g.sk[p.pid];
                if (!s || !(s.toi > 0)) { p.res = 'V'; p.goals = 0; } // didn't play: sportsbooks void the bet
                else { p.goals = s.g; p.res = s.g > 0 ? 'W' : 'L'; }
                p.profit = p.res === 'W' ? (p.dk < 0 ? 100 : p.dk) : p.res === 'L' ? -(p.dk < 0 ? -p.dk : 100) : 0;
                graded++;
              }
            }
            // grade game picks
            let gGraded = 0;
            for (const p of [...gByKey.values()].filter(p => p.hw == null && new Date(p.start) < new Date(now - 4 * 3600e3))) {
              let g = null; try { g = await T.getGame(p.gid); } catch (e) { log(`Game ${p.gid}: ${e.message}`); }
              if (!g || !g.final) continue;
              p.hs = g.home.score; p.as = g.away.score; p.hw = g.home.score > g.away.score; p.ot = !!(g.ot || g.so);
              const price = p.side === 'h' ? p.mlH : p.mlA, won = p.side === 'h' ? p.hw : !p.hw;
              p.profit = won ? (price < 0 ? 100 : price) : -(price < 0 ? -price : 100);
              gGraded++;
            }
            log(`Graded ${graded} goal scorer picks and ${gGraded} game picks.`);
            // today's model test scores, for the accuracy-over-time charts (one snapshot per day)
            const hist = (picks.hist || []).filter(h => h.date !== today), snap = { date: today };
            if (gmOK) { const M = T.GM.model; snap.gm = { n: M.nRows, test: M.nTest, acc: +M.sKeep.acc.toFixed(4), ll: +M.sKeep.ll.toFixed(4), base: +M.sBase.ll.toFixed(4), mktAcc: M.market ? +M.market.acc.toFixed(4) : null, mktLl: M.market ? +M.market.ll.toFixed(4) : null }; }
            if (gs && gs.bt) snap.gs = { n: gs.bt.n, games: T.A.filtered.length, brier: +gs.bt.brier.toFixed(5), brierBase: +gs.bt.brierBase.toFixed(5) };
            if (snap.gm || snap.gs) hist.push(snap);
            const out = { updated: now.toISOString(), picks: [...byKey.values()].sort((a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : b.ev - a.ev), games: [...gByKey.values()].sort((a, b) => a.start < b.start ? -1 : 1), hist: hist.sort((a, b) => a.date < b.date ? -1 : 1) };
            fs.writeFileSync('picks.json', JSON.stringify(out));
            return out;
          }
          module.exports = { run };
          if (require.main === module) run().then(() => process.exit(0)).catch(e => { console.log('::error::' + (e.stack || e.message)); process.exit(1); });
          EOF
          NODE_PATH="$RUNNER_TEMP/tk/node_modules" node "$RUNNER_TEMP/track.js"

      - name: Commit props.json, picks.json and posthockey.json if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add props.json picks.json posthockey.json 2>/dev/null || git add props.json picks.json
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Update DraftKings odds, Post Hockey ratings, picks and model accuracy"
          git pull --rebase --quiet || true
          git push

  close:
    # every 30 minutes in the evening: record closing prices for picks starting in the next 45 minutes (closing line value)
    needs: lines
    if: always() && github.event_name == 'schedule' && github.event.schedule != '7 15 * * *' && github.event.schedule != '7 21 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Record closing prices for picks starting soon
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git pull --quiet || true
          cat > "$RUNNER_TEMP/close.js" <<'EOF'
          // Closing prices for saved picks: runs every 30 minutes and records the price just before puck drop
          // (the moneyline from ESPN, and DraftKings' goal scorer price via The Odds API) so the dashboard can measure closing line value.
          const fs = require('fs');
          const log = (...a) => console.log(...a);
          const normName = x => (x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');
          const etDay = d => new Date(d).toLocaleDateString('en-CA', { timeZone: 'America/New_York' }).replace(/-/g, '');
          async function run({ fetchImpl = fetch, now = Date.now(), key = process.env.ODDS_API_KEY } = {}) {
            let P; try { P = JSON.parse(fs.readFileSync('picks.json', 'utf8')); } catch (e) { log('No picks.json yet.'); return 0; }
            const W = 45 * 60e3, soon = x => { const t = new Date(x.start).getTime(); return t > now && t - now <= W; };
            const fresh = x => !x.closeAt || now - new Date(x.closeAt).getTime() > 20 * 60e3; // refresh at most every 20 minutes
            const games = (P.games || []).filter(soon), picks = (P.picks || []).filter(p => soon(p) && p.dk != null && fresh(p));
            if (!games.length && !picks.length) { log('No saved picks starting in the next 45 minutes.'); return 0; }
            let changed = 0;
            // moneylines (ESPN, free)
            for (const day of new Set(games.map(g => etDay(g.start)))) {
              let sb = null; try { const r = await fetchImpl(`https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=${day}`); sb = r.ok ? await r.json() : null; } catch (e) { log('ESPN error: ' + e.message); }
              for (const g of games.filter(x => etDay(x.start) === day)) {
                const e = sb && (sb.events || []).find(x => String(x.id) === g.gid), c = e && e.competitions[0];
                if (!c || c.status.type.state !== 'pre') continue;
                const o = c.odds && c.odds[0], h = o && o.homeTeamOdds && o.homeTeamOdds.moneyLine, a = o && o.awayTeamOdds && o.awayTeamOdds.moneyLine;
                if (h != null && a != null && h !== '' && a !== '' && isFinite(h) && isFinite(a)) { g.mlCloseH = +h; g.mlCloseA = +a; g.closeAt = new Date(now).toISOString(); changed++; log(`${g.aa} @ ${g.ha}: closing moneyline ${a} / ${h}`); }
              }
            }
            // goal scorer prices (DraftKings via The Odds API; one request per game starting soon)
            if (picks.length && !key) log('No ODDS_API_KEY: skipping goal scorer closing prices.');
            if (picks.length && key) {
              const BASE = 'https://api.the-odds-api.com/v4/sports/icehockey_nhl';
              let events = []; try { const r = await fetchImpl(`${BASE}/events?apiKey=${key}`); events = r.ok ? await r.json() : []; } catch (e) { log('Odds API error: ' + e.message); }
              for (const ev of events) {
                const t = new Date(ev.commence_time).getTime(); if (!(t > now && t - now <= W)) continue;
                const mine = picks.filter(p => Math.abs(new Date(p.start).getTime() - t) < 20 * 60e3); if (!mine.length) continue;
                try {
                  const r = await fetchImpl(`${BASE}/events/${ev.id}/odds?apiKey=${key}&regions=us&markets=player_goal_scorer_anytime&bookmakers=draftkings&oddsFormat=american`);
                  if (!r.ok) throw new Error('HTTP ' + r.status);
                  const data = await r.json(), bk = (data.bookmakers || []).find(b => b.key === 'draftkings'), mk = bk && (bk.markets || []).find(m => m.key === 'player_goal_scorer_anytime');
                  const m = {}; for (const o of (mk && mk.outcomes) || []) if (!/^no$/i.test(o.name || '') && Number.isFinite(o.price)) m[normName(o.description || o.name)] = o.price;
                  let n = 0; for (const p of mine) { const price = m[normName(p.n)]; if (price != null) { p.dkClose = price; p.closeAt = new Date(now).toISOString(); n++; changed++; } }
                  log(`${ev.away_team} @ ${ev.home_team}: closing DraftKings prices for ${n} saved picks`);
                } catch (e) { log(`::warning::${ev.away_team} @ ${ev.home_team}: ${e.message}`); }
              }
            }
            if (changed) fs.writeFileSync('picks.json', JSON.stringify(P));
            log(`Recorded ${changed} closing prices.`);
            return changed;
          }
          module.exports = { run };
          if (require.main === module) run().then(() => process.exit(0)).catch(e => { console.log('::error::' + (e.stack || e.message)); process.exit(1); });
          EOF
          node "$RUNNER_TEMP/close.js"

      - name: Commit picks.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add picks.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Record closing prices"
          git pull --rebase --quiet || true
          git push
